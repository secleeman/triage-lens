[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage-lens"
version = "0.1.0"
description = "スキャナの脆弱性リストを公開データで優先順位付けし、トリアージレポートを生成するCLIツール"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# ruff は書式ルールがマイナーバージョンで変わることがあるため範囲を固定する
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.urls]
Homepage = "https://github.com/secleeman/triage-lens"

[project.scripts]
triage-lens = "triage_lens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
