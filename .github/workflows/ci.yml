name: CI

on:
  # Pull Request と main への反映時に実行する
  # （push を全ブランチ対象にすると PR で二重に走るため main だけにしている）
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: テストとlint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: テスト (pytest)
        run: pytest
